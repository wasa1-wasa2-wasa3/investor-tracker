name: X投稿・イナゴ度の取り込み（Grok Bot）

# Grok Bot が「[X投稿]」で始まるタイトルの Issue を作ると、本文のJSONを data/x-posts.json に取り込む。
# 「[イナゴ度]」で始まるタイトルなら data/inago.json に取り込む。
# 取り込むのは、許可したGitHubユーザー（リポジトリ変数 X_IMPORT_AUTHORS、空ならリポジトリの持ち主）の Issue だけ。
on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  import:
    if: startsWith(github.event.issue.title, '[X投稿]') || startsWith(github.event.issue.title, '[イナゴ度]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 投稿者を確認
        id: auth
        env:
          AUTHOR: ${{ github.event.issue.user.login }}
          OWNER: ${{ github.repository_owner }}
          ALLOWED: ${{ vars.X_IMPORT_AUTHORS }}
        run: |
          list="${ALLOWED:-$OWNER}"
          ok=false
          for u in $(echo "$list" | tr ',' ' '); do [ "$u" = "$AUTHOR" ] && ok=true; done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "投稿者 $AUTHOR / 許可 $list → $ok"
      - uses: actions/checkout@v4
        if: steps.auth.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.auth.outputs.ok == 'true'
        with:
          node-version: 22
      - name: 取り込み
        id: imp
        if: steps.auth.outputs.ok == 'true'
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          case "$TITLE" in
            "[イナゴ度]"*) node scripts/import-inago-issue.mjs ;;
            *) node scripts/import-x-issue.mjs ;;
          esac
      - name: コミット
        if: steps.auth.outputs.ok == 'true' && steps.imp.outputs.changed == 'true'
        run: |
          if git diff --quiet data/x-posts.json data/inago.json; then echo "変更なし"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/x-posts.json data/inago.json
          git commit -m "Grok Botの結果を取り込み（Issue #${{ github.event.issue.number }}）"
          git pull --rebase -q origin main
          git push
      - name: 結果をIssueに返信して閉じる
        if: steps.auth.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          RESULT: ${{ steps.imp.outputs.result }}
        run: |
          gh issue comment "$NUM" -R "$GITHUB_REPOSITORY" --body "$RESULT"
          if [ "${{ steps.imp.outputs.changed }}" = "true" ]; then gh issue close "$NUM" -R "$GITHUB_REPOSITORY"; fi
