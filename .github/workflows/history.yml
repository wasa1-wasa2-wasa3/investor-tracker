name: 履歴と優待の更新

on:
  schedule:
    # 平日 19:37（日本時間）。報告書は日中〜夕方に出るので、その後に取りに行く
    - cron: "37 10 * * 1-5"
  workflow_dispatch:
    inputs:
      days:
        description: "何日分さかのぼって取り直すか（空欄なら自動：初回は半年分／以降14日分）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 依存パッケージを入れる
        run: npm ci --no-audit --no-fund
      - name: EDINETから履歴を取得
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          DAYS: ${{ github.event.inputs.days }}
        run: |
          if [ -n "$DAYS" ]; then
            node scripts/update-history.mjs --days "$DAYS"
          else
            node scripts/update-history.mjs
          fi
      - name: 有価証券報告書から優待情報を取得
        continue-on-error: true
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: node scripts/update-yutai.mjs
      - name: 大量保有報告書から保有割合を取得
        continue-on-error: true
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: node scripts/update-holdings.mjs
      - name: 大物のX投稿から銘柄の言及を取得（Grok）
        continue-on-error: true
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          X_SOURCE: ${{ vars.X_SOURCE }}
        run: |
          # X投稿は Grok Bot（Issue経由・x-import.yml）で取り込む。APIで取るときはリポジトリ変数 X_SOURCE=api
          if [ "$X_SOURCE" != "api" ]; then echo "X投稿はGrok Bot経由のためスキップ"; exit 0; fi
          if [ -z "$XAI_API_KEY" ]; then echo "XAI_API_KEY 未設定のためスキップ"; exit 0; fi
          node scripts/update-x.mjs
      - name: イナゴ度の調査対象（20選の上位10）を書き出す（Grok Botが日曜14時に読む）
        continue-on-error: true
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: node scripts/update-inago-targets.mjs
      - name: 変更があればコミット
        run: |
          if git diff --quiet data/; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/yutai.json data/asr-index.json data/holdings.json data/x-posts.json data/x-debug.json data/inago-targets.json
          git commit -m "履歴を更新 $(date -u +%Y-%m-%d)"
          git push
